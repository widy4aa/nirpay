version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nirpay-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nirpay
      POSTGRES_PASSWORD: nirpay123
      POSTGRES_DB: nirpay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nirpay -d nirpay']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nirpay-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: nirpay-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /tmp/mailpit.db
    volumes:
      - mailpit_data:/tmp

  backend:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: nirpay-backend
    restart: unless-stopped
    ports:
      - '3001:8000'
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=nirpay
      - DB_USERNAME=nirpay
      - DB_PASSWORD=nirpay123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-laravel:/var/www/html
      - vendor_data:/var/www/html/vendor

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  vendor_data:
